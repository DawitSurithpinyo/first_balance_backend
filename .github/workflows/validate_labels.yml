name: validate PR labels

on:
  workflow_call:
    outputs:
      RELEASE_LABEL:
        description: "Release label. One of: 'major', 'minor', 'patch', 'skip'.\n 
          'skip' is for merges that don't require build/release/deploy e.g., doc updates."
        value: ${{ jobs.validate_label.outputs.RELEASE_LABEL }}

jobs:
  validate_label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
    outputs:
      RELEASE_LABEL: ${{ steps.check_release.outputs.RELEASE_LABEL }}
    steps:
      - name: check release labels
        id: check_release
        run: |
          RELEASE_LABEL=""

          if [[ "$LABELS" =~ (^| )skip($| ) ]]; then
            echo "RELEASE_LABEL=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          RELEASE_LABEL_COUNT=0
          if [[ "$LABELS" =~ (^| )major($| ) ]]; then
            RELEASE_LABEL_COUNT=$((RELEASE_LABEL_COUNT + 1))
            RELEASE_LABEL=major
          elif [[ "$LABELS" =~ (^| )minor($| ) ]]; then
            RELEASE_LABEL_COUNT=$((RELEASE_LABEL_COUNT + 1))
            RELEASE_LABEL=minor
          elif [[ "$LABELS" =~ (^| )patch($| ) ]]; then
            RELEASE_LABEL_COUNT=$((RELEASE_LABEL_COUNT + 1))
            RELEASE_LABEL=patch
          fi

          if [ "$RELEASE_LABEL_COUNT" -ne 1 ]; then
            echo "PR must have exactly one of: major, minor, patch"
            exit 1
          fi
          echo "RELEASE_LABEL=$RELEASE_LABEL" >> $GITHUB_OUTPUT