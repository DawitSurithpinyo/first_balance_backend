services:
  redis:
    image: redis:alpine3.23
    container_name: fb_redis_dev
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - fb_standalone_redis_data:/data
      - ../ops/development/config/redis.dev.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

volumes:
  fb_standalone_redis_data: